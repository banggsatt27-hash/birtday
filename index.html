<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love 🤍</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .box {
    background: rgba(255,255,255,0.18);
    padding: 25px 20px;
    border-radius: 20px;
    width: 90%;
    max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  p {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  button {
    padding: 12px 20px;
    margin: 6px;
    border: none;
    border-radius: 20px;
    background: #fff;
    color: #333;
    font-size: 15px;
    cursor: pointer;
    position: relative;
    z-index: 10;
  }

  button:active {
    transform: scale(0.95);
  }

  .gift {
    font-size: 80px;
    cursor: pointer;
  }

  .poop {
    font-size: 90px;
  }

  .cake {
    font-size: 70px;
    margin-top: 10px;
  }
</style>
</head>

<body>

<div class="box">
  <p id="text">
    Hai Nabilla Nur Fauziyyah 🤍<br><br>
    Pacar awak ulang tahun hari ko 🎂<br><br>
    Paja tu cantik, pemarah, ngeselin pokoknya 😌<br><br>
    Nak kado ZD dak?
  </p>

  <div id="buttons">
    <button onclick="nextStep()">Nak</button>
    <button onclick="nextStep()">Idak</button>
  </div>
</div>

<script>
let step = 0;
const text = document.getElementById("text");
const buttons = document.getElementById("buttons");

function nextStep() {
  step++;

  if (step === 1) {
    text.innerHTML = "Yo, kalo gitu buka kado nyo 🎁";
    buttons.innerHTML = `<div class="gift" onclick="nextStep()">🎁</div>`;
  }

  else if (step === 2) {
    text.innerHTML = `<div class="poop">💩</div>`;
    buttons.innerHTML = `<button onclick="nextStep()">😑</button>`;
  }

  else if (step === 3) {
    text.innerHTML =
      "Hahaha, kalo nak kado besok pagi yo awak kasih.<br><br>" +
      "Gimano raso nyo jadi orang besak?";
    buttons.innerHTML = `<button onclick="nextStep()">Dak Enak</button>`;
  }

  else if (step === 4) {
    text.innerHTML =
      "Haha, mako nyo nikah lah lagi biak hidup tu enak 😆";
    buttons.innerHTML = `<button onclick="nextStep()">😳</button>`;
  }

  else if (step === 5) {
    text.innerHTML =
      "Selamat ulang tahun yo sayang 🤍<br><br>" +
      "Semoga makin bertambah nyo umur kamu semakin banyak jugo rezeki";
    buttons.innerHTML = `<button onclick="nextStep()">Amin</button>`;
  }

  else if (step === 6) {
    text.innerHTML =
      "Semoga di ulang tahun kamu kali ini yang dewasa bukan cuma umur kamu, " +
      "tapi pemikiran kamu jugo";
    buttons.innerHTML = `<button onclick="nextStep()">Amin</button>`;
  }

  else if (step === 7) {
    text.innerHTML =
      "Semoga kamu tambah bersinar lagi baik di keluarga maupun " +
      "di lingkungan sekitar kamu";
    buttons.innerHTML = `<button onclick="nextStep()">Amin</button>`;
  }

  else if (step === 8) {
    text.innerHTML =
      "Semoga di umur kamu yang ke 20 tahun ini, " +
      "makin banyak berita bahagia yang bakal datang ke kamu";
    buttons.innerHTML = `<button onclick="nextStep()">Amin</button>`;
  }

  else if (step === 9) {
    text.innerHTML =
      "Dan semoga apo yang kamu semoga kan, " +
      "tersemogakan di tahun ini yo sayang 🤍";
    buttons.innerHTML = `<button onclick="nextStep()">🤍</button>`;
  }

  else if (step === 10) {
    text.innerHTML =
      "Selalu sayang samo awak yo sayang.<br><br>" +
      "Karno awak di sini jugo bakal selalu sayang samo kamu.<br><br>" +
      "Awak dak bakal ninggalin kamu dewean sampai kapan pun sayang.";
    buttons.innerHTML = `<button onclick="nextStep()">🥹</button>`;
  }

  else if (step === 11) {
    text.innerHTML =
      "Ohhh iyo, ini lagu tahun berapo gitu awak buatin lagu ini untuk kamu, dengerin yoo 🎶";
    buttons.innerHTML = `
      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/track/6UymrSXDvie9LdLlckCUZE"
        width="100%" height="152" frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>
      <br><br>
      <button onclick="nextStep()">Lanjut</button>
    `;
  }

  else if (step === 12) {
    text.innerHTML =
      "Sampai selesai dak dengerin lagu nyo?<br><br>" +
      "Hahaha, sudah lah intinyo awak sayang kamu";
    buttons.innerHTML = `<button onclick="nextStep()">🤍</button>`;
  }

  else if (step === 13) {
    text.innerHTML =
      "Sebelum ini di tutup, awak punyo pantun:<br><br>" +
      "Ikan teri di makan ikan pari";
    buttons.innerHTML = `<button onclick="nextStep()">Cakep</button>`;
  }

  else if (step === 14) {
    text.innerHTML = "I Love You Nabilla ❤️";
    buttons.innerHTML = `<button onclick="nextStep()">🥰</button>`;
  }

  else if (step === 15) {
    text.innerHTML = "Happy Birthday My Love!! 🎉";
    buttons.innerHTML = `<div class="cake">🎂</div>`;
  }
}
</script>

</body>
</html>
